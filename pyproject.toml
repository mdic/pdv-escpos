[project]
name = "pdv-escpos"
version = "0.1.0"
description = "Render HTML/CSS receipts and print them on USB ESC/POS printers"
readme = "README.md"
authors = [
    { name = "mdic", email = "deek85@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2,<9",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "python-escpos[usb]==3.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
pdv-escpos = "pdv_escpos.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
