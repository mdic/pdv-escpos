render:
  # Printable width in printer dots. 384 is common for 58 mm paper.
  width: 384
  dither: threshold
  threshold: 160
  contrast: 1.15
  brightness: 1.0

usb:
  # Detected device: GDMicroelectronics / YICHIP YC Printer demo.
  vendor_id: 0x28e9
  product_id: 0x0289
  in_endpoint: 0x81
  out_endpoint: 0x01
  timeout: 0
  profile: default

printing:
  image_impl: bitImageRaster
  fragment_height: 960
  fragment_sleep_ms: 0
  feed_lines: 4
  # The detected printer may not have a cutter, so this is disabled by default.
  cut: false
  cut_mode: FULL
